name: CD

on:
  push:
    branches: [main]
    tags:
      - "v*"

env:
  DATABASE_URL: postgresql://teamdocs:teamdocs@postgres:5432/teamdocs?schema=public
  AUTH_SECRET: ci-test-auth-secret-min-32-chars-long
  AUTH_URL: http://localhost:3000
  COLLAB_SECRET: ci-test-collab-secret-shared
  NEXT_PUBLIC_COLLAB_WS_URL: ws://localhost:1234

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.repository_owner != ''
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/web
            ghcr.io/${{ github.repository }}/collab
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            AUTH_SECRET=${{ env.AUTH_SECRET }}
            DATABASE_URL=${{ env.DATABASE_URL }}
            AUTH_URL=${{ env.AUTH_URL }}
            COLLAB_SECRET=${{ env.COLLAB_SECRET }}
            NEXT_PUBLIC_COLLAB_WS_URL=${{ env.NEXT_PUBLIC_COLLAB_WS_URL }}

      - name: Build and push collab
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.collab
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}/collab:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
