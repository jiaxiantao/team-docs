name: CI

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]

env:
  DATABASE_URL: postgresql://teamdocs:teamdocs@localhost:5432/teamdocs?schema=public
  AUTH_SECRET: ci-test-auth-secret-min-32-chars-long
  AUTH_URL: http://localhost:3000
  COLLAB_SECRET: ci-test-collab-secret-shared
  NEXT_PUBLIC_COLLAB_WS_URL: ws://localhost:1234

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teamdocs
          POSTGRES_PASSWORD: teamdocs
          POSTGRES_DB: teamdocs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamdocs -d teamdocs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Run database migrations
        run: pnpm exec prisma migrate deploy

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build Next.js
        run: pnpm run build
        env:
          SKIP_ENV_VALIDATION: "1"

  docker-verify:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build web image
        run: |
          docker build -f Dockerfile -t team-docs-web:ci . \
            --build-arg AUTH_SECRET="${{ env.AUTH_SECRET }}" \
            --build-arg DATABASE_URL="${{ env.DATABASE_URL }}" \
            --build-arg AUTH_URL="${{ env.AUTH_URL }}" \
            --build-arg COLLAB_SECRET="${{ env.COLLAB_SECRET }}" \
            --build-arg NEXT_PUBLIC_COLLAB_WS_URL="${{ env.NEXT_PUBLIC_COLLAB_WS_URL }}"

      - name: Build collab image
        run: docker build -f Dockerfile.collab -t team-docs-collab:ci .

  release:
    runs-on: ubuntu-latest
    needs: quality
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            AUTH_SECRET=${{ env.AUTH_SECRET }}
            DATABASE_URL=${{ env.DATABASE_URL }}
            AUTH_URL=${{ env.AUTH_URL }}
            COLLAB_SECRET=${{ env.COLLAB_SECRET }}
            NEXT_PUBLIC_COLLAB_WS_URL=${{ env.NEXT_PUBLIC_COLLAB_WS_URL }}

      - name: Build and push collab
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.collab
          push: true
          tags: ghcr.io/${{ github.repository }}/collab:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
